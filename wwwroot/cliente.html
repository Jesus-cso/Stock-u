<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caja | StockUPT</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #fff;
            --tx: #1d2330;
            --mut: #667085;
            --bd: #e0e3e8;
            --ent: #14804a;
            --sal: #c2410c;
            --bad: #b42318;
            --acc: var(--sal)
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #14171d;
                --card: #1d222b;
                --tx: #e8ebf0;
                --mut: #9aa4b2;
                --bd: #2c3340;
                --ent: #4ade80;
                --sal: #fb923c;
                --bad: #f87171
            }
        }

        body.entrada {
            --acc: var(--ent)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 15px system-ui,Segoe UI,sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        header {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 3px solid var(--acc);
            flex-wrap: wrap
        }

        h1 {
            font-size: 18px;
            margin: 0
        }

        .modos {
            display: flex;
            gap: 8px
        }

            .modos button {
                padding: 10px 22px;
                border: 2px solid var(--bd);
                background: var(--card);
                color: var(--tx);
                border-radius: 10px;
                font-weight: 700;
                cursor: pointer
            }

                .modos button.on {
                    border-color: var(--acc);
                    background: var(--acc);
                    color: #fff
                }

        main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            padding: 16px 20px;
            max-width: 1200px;
            margin: auto
        }

        @media(max-width:850px) {
            main {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px
        }

        #scan {
            width: 100%;
            font-size: 20px;
            padding: 14px;
            border: 2px solid var(--acc);
            border-radius: 10px;
            background: var(--bg);
            color: var(--tx)
        }

        #msg {
            min-height: 22px;
            margin: 8px 2px;
            font-weight: 600
        }

        .ok {
            color: var(--ent)
        }

        .err {
            color: var(--bad)
        }

        .tabla {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--bd);
            text-align: left
        }

        th {
            font-size: 12px;
            color: var(--mut);
            text-transform: uppercase
        }

            td.num, th.num {
                text-align: right
            }

        tr.falta td {
            background: color-mix(in srgb,var(--bad) 14%,transparent)
        }

        .cant {
            display: flex;
            align-items: center;
            gap: 4px
        }

            .cant button, .x {
                width: 28px;
                height: 28px;
                border: 1px solid var(--bd);
                background: var(--card);
                color: var(--tx);
                border-radius: 6px;
                cursor: pointer
            }

            .cant input, .pu {
                width: 64px;
                padding: 5px;
                border: 1px solid var(--bd);
                border-radius: 6px;
                background: var(--bg);
                color: var(--tx);
                text-align: center
            }

        label {
            display: block;
            font-size: 12px;
            color: var(--mut);
            margin: 10px 0 3px
        }

        .f {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx)
        }

        .tot {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin-top: 14px
        }

        #ok {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: var(--acc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer
        }

            #ok:disabled {
                opacity: .5;
                cursor: not-allowed
            }

        .sec {
            background: none;
            border: 0;
            color: var(--mut);
            cursor: pointer;
            margin-top: 8px;
            width: 100%
        }

        .vacio {
            text-align: center;
            color: var(--mut);
            padding: 28px
        }

        .solo-ent {
            display: none
        }

        body.entrada .solo-ent {
            display: block
        }

        body.entrada .solo-sal {
            display: none
        }
    </style>
</head>
<body class="salida">
    <script src="sesion.js"></script>
    <header>
        <h1>Caja StockUPT <small id="quien" style="color:var(--mut);font-weight:400"></small></h1>
        <div class="modos">
            <button id="bSal" class="on">Nota de salida</button>
            <button id="bEnt">Nota de entrada</button>
        </div>
        <a href="Dashbord.html" style="color:var(--mut)">Volver</a>
    </header>

    <main>
        <section class="card">
            <input id="scan" placeholder="Escanea o escribe el codigo de barras y presiona Enter" autocomplete="off" autofocus>
            <div id="msg"></div>
            <div class="tabla">
                <table>
                    <thead><tr><th>Producto</th><th>Codigo</th><th class="num">Stock</th><th class="solo-ent">Precio</th><th>Cantidad</th><th class="num">Subtotal</th><th></th></tr></thead>
                    <tbody id="filas"></tbody>
                </table>
                <div id="vacio" class="vacio">Aun no hay productos. Escanea el primero.</div>
            </div>
        </section>

        <aside class="card">
            <div class="solo-sal">
                <label>Matricula *</label><input id="mat" class="f">
                <label>Nombre *</label><input id="nom" class="f">
                <label>Area</label><input id="area" class="f">
                <label>No. de proyecto (opcional)</label><input id="proy" class="f">
            </div>
            <div class="solo-ent">
                <label>Proveedor *</label><select id="prov" class="f"></select>
                <label>Factura</label><input id="fact" class="f">
                <label>Observaciones</label><input id="obs" class="f" maxlength="300">
            </div>
            <div class="tot"><span>Articulos</span><span id="nArt">0</span></div>
            <div class="tot"><span>Total</span><span id="total">$0.00</span></div>
            <button id="ok" disabled>Registrar</button>
            <button class="sec" id="limpiar">Vaciar tabla</button>
        </aside>
    </main>

    <script>
        const API = "http://localhost:3000";
        let modo = "salida";
        let items = []; // {id, nombre, codigo, stock, precio, cant}

        const $ = id => document.getElementById(id);
        const dinero = n => "$" + Number(n || 0).toFixed(2);

        function aviso(t, tipo) { const m = $("msg"); m.textContent = t; m.className = tipo || ""; }
        function enfocar() { $("scan").focus(); }

        try {
            const u = JSON.parse(localStorage.getItem("usuarioActivo") || sessionStorage.getItem("usuarioActivo") || "{}");
            if (u.nombre) $("quien").textContent = "| " + u.nombre;
        } catch (e) { }

        /* ---------- modo ---------- */
        function cambiarModo(m) {
            modo = m;
            document.body.className = m;
            $("bSal").classList.toggle("on", m === "salida");
            $("bEnt").classList.toggle("on", m === "entrada");
            if (m === "entrada" && !$("prov").options.length) cargarProveedores();
            pintar(); enfocar();
        }
        $("bSal").onclick = () => cambiarModo("salida");
        $("bEnt").onclick = () => cambiarModo("entrada");

        async function cargarProveedores() {
            try {
                const r = await fetch(API + "/proveedores");
                const lista = await r.json();
                $("prov").innerHTML = "<option value=''>Selecciona...</option>";
                lista.forEach(p => {
                    const o = document.createElement("option");
                    o.value = p.id_proveedor; o.textContent = p.nombre;
                    $("prov").appendChild(o);
                });
            } catch (e) { aviso("No se pudieron cargar los proveedores.", "err"); }
        }

        /* ---------- escaneo ---------- */
        $("scan").addEventListener("keydown", async e => {
            if (e.key !== "Enter") return;
            const codigo = $("scan").value.trim();
            $("scan").value = "";
            if (!codigo) return;
            try {
                const r = await fetch(API + "/productos/codigo/" + encodeURIComponent(codigo));
                if (r.status === 404) { aviso("No existe un producto con el codigo " + codigo, "err"); return; }
                if (!r.ok) { aviso("Error del servidor (" + r.status + ").", "err"); return; }
                const p = (await r.json()).producto;
                const ya = items.find(i => i.id === p.id_producto);
                if (ya) ya.cant++;
                else items.push({ id: p.id_producto, nombre: p.nombre, codigo: p.codigo_barras, stock: p.stock, precio: Number(p.precio || 0), cant: 1 });
                aviso("Agregado: " + p.nombre, "ok");
                pintar();
            } catch (err) { aviso("No se pudo consultar el producto.", "err"); }
        });

        /* ---------- tabla ---------- */
        function celda(tr, txt, cls) { const td = tr.insertCell(); td.textContent = txt; if (cls) td.className = cls; return td; }

        function pintar() {
            const tb = $("filas"); tb.innerHTML = "";
            let total = 0, arts = 0, falta = false;
            items.forEach((it, idx) => {
                const sinStock = modo === "salida" && it.cant > it.stock;
                if (sinStock) falta = true;
                total += it.cant * it.precio; arts += it.cant;
                const tr = tb.insertRow(); if (sinStock) tr.className = "falta";
                celda(tr, it.nombre);
                celda(tr, it.codigo);
                celda(tr, it.stock, "num");
                const tdp = tr.insertCell(); tdp.className = "solo-ent";
                const pu = document.createElement("input"); pu.className = "pu"; pu.type = "number"; pu.min = 0; pu.step = "0.01"; pu.value = it.precio;
                pu.onchange = () => { it.precio = Math.max(0, Number(pu.value) || 0); pintar(); };
                tdp.appendChild(pu);
                const tdc = tr.insertCell(); const c = document.createElement("div"); c.className = "cant";
                const mn = document.createElement("button"); mn.textContent = "-";
                const inp = document.createElement("input"); inp.type = "number"; inp.min = 1; inp.value = it.cant;
                const mas = document.createElement("button"); mas.textContent = "+";
                mn.onclick = () => { it.cant = Math.max(1, it.cant - 1); pintar(); };
                mas.onclick = () => { it.cant++; pintar(); };
                inp.onchange = () => { it.cant = Math.max(1, parseInt(inp.value) || 1); pintar(); };
                c.append(mn, inp, mas); tdc.appendChild(c);
                celda(tr, dinero(it.cant * it.precio), "num");
                const tdx = tr.insertCell(); const x = document.createElement("button"); x.className = "x"; x.textContent = "x";
                x.onclick = () => { items.splice(idx, 1); pintar(); enfocar(); }; tdx.appendChild(x);
            });
            $("vacio").style.display = items.length ? "none" : "block";
            $("nArt").textContent = arts; $("total").textContent = dinero(total);
            $("ok").disabled = !items.length || falta;
            $("ok").textContent = modo === "salida" ? "Registrar salida" : "Registrar entrada";
            if (falta) aviso("Hay productos con mas cantidad que el stock disponible.", "err");
        }

        $("limpiar").onclick = () => { items = []; pintar(); enfocar(); };

        /* ---------- guardar ---------- */
        $("ok").onclick = async () => {
            let url, body;
            if (modo === "salida") {
                const mat = $("mat").value.trim(), nom = $("nom").value.trim();
                if (!mat || !nom) { aviso("Matricula y nombre son obligatorios.", "err"); return; }
                url = API + "/Notas/salida";
                body = {
                    matricula: mat, nombre: nom, area: $("area").value.trim(), numero_proyecto: $("proy").value.trim() || undefined,
                    items: items.map(i => ({ id_producto: i.id, cantidad: i.cant }))
                };
            } else {
                if (!$("prov").value) { aviso("Selecciona un proveedor.", "err"); return; }
                url = API + "/notasEntrada";
                body = {
                    id_proveedor: Number($("prov").value), factura: $("fact").value.trim(), observaciones: $("obs").value.trim(),
                    productos: items.map(i => ({ id_producto: i.id, cantidad: i.cant, precio_unitario: i.precio }))
                };
            }
            $("ok").disabled = true;
            try {
                const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { aviso(d.error || "No se pudo guardar (" + r.status + ").", "err"); $("ok").disabled = false; return; }
                aviso("Nota registrada" + (d.folio ? ": " + d.folio : "") + ".", "ok");
                items = []; pintar();
            } catch (e) { aviso("No se pudo conectar con el servidor.", "err"); $("ok").disabled = false; }
            enfocar();
        };

        pintar();
    </script>
</body>
</html>
