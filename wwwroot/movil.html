<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <title>Scanner StockUPT</title>

    <style>
        :root {
            --fondo: #0F172A;
            --panel: #1E293B;
            --linea: #334155;
            --texto: #F1F5F9;
            --suave: #94A3B8;
            --azul: #2563EB;
            --verde: #16A34A;
            --rojo: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: system-ui, Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
            background: var(--panel);
            border-bottom: 1px solid var(--linea);
        }

            header h1 {
                font-size: 16px;
                font-weight: 700;
            }

        .conexion {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--suave);
        }

        .punto {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--suave);
            flex: none;
        }

            .punto.ok {
                background: #22C55E;
            }

            .punto.mal {
                background: #EF4444;
            }

        .btn-icono {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--linea);
            background: transparent;
            color: var(--texto);
            font-size: 18px;
            display: none;
        }

            .btn-icono.activo {
                background: #FACC15;
                color: #111;
            }

        main {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #000;
        }

        #lector {
            width: 100%;
            height: 100%;
        }

            #lector video {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover;
            }

        .aviso-camara {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 28px;
            text-align: center;
            background: var(--fondo);
        }

            .aviso-camara.visible {
                display: flex;
            }

            .aviso-camara h2 {
                font-size: 18px;
            }

            .aviso-camara p {
                font-size: 14px;
                color: var(--suave);
                line-height: 1.5;
            }

            .aviso-camara button, .aviso-camara a {
                background: var(--azul);
                color: white;
                border: 0;
                border-radius: 10px;
                padding: 12px 18px;
                font-size: 15px;
                font-weight: 700;
                text-decoration: none;
            }

        #chip {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 14px;
            padding: 13px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            background: rgba(15, 23, 42, .88);
            opacity: 0;
            transform: translateY(8px);
            transition: .2s;
            pointer-events: none;
        }

            #chip.visible {
                opacity: 1;
                transform: translateY(0);
            }

            #chip.ok {
                background: var(--verde);
            }

            #chip.mal {
                background: var(--rojo);
            }

        footer {
            background: var(--panel);
            border-top: 1px solid var(--linea);
            padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
        }

        form {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid var(--linea);
            background: var(--fondo);
            color: var(--texto);
        }

        form button {
            padding: 0 18px;
            border: 0;
            border-radius: 10px;
            background: var(--azul);
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        #historial {
            list-style: none;
            margin-top: 10px;
            max-height: 96px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--suave);
        }

            #historial li {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                padding: 4px 0;
            }

                #historial li b {
                    color: var(--texto);
                    font-family: monospace;
                }

            #historial .ok {
                color: #4ADE80;
            }

            #historial .mal {
                color: #F87171;
            }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Scanner StockUPT</h1>
            <div class="conexion">
                <span class="punto" id="punto"></span>
                <span id="estadoPc">Conectando con la PC...</span>
            </div>
        </div>

        <button class="btn-icono" id="btnLinterna" type="button" title="Linterna">🔦</button>
    </header>

    <main>
        <div id="lector"></div>

        <div class="aviso-camara" id="avisoCamara">
            <h2 id="avisoTitulo"></h2>
            <p id="avisoTexto"></p>
            <div id="avisoAccion"></div>
        </div>

        <div id="chip"></div>
    </main>

    <footer>
        <form id="formManual" autocomplete="off">
            <input type="text" id="codigoManual"
                   placeholder="¿No lee? Escribe el código"
                   aria-label="Código manual">
            <button type="submit">Enviar</button>
        </form>

        <ul id="historial"></ul>
    </footer>

    <script src="movil/html5-qrcode.min.js"></script>

    <script>
        (function () {
            "use strict";

            const $ = id => document.getElementById(id);

            const punto = $("punto");
            const estadoPc = $("estadoPc");
            const chip = $("chip");
            const historial = $("historial");
            const btnLinterna = $("btnLinterna");

            // ── Autenticación del escáner ──────────────────────────

            let token = "";

            function obtenerToken() {
                try {
                    // Se lee el hash a mano: URLSearchParams convertiría "+" en espacio
                    const m = location.hash.match(/[#&]t=([^&]*)/);

                    if (m && m[1]) {
                        let tokenUrl = m[1];
                        try { tokenUrl = decodeURIComponent(tokenUrl); } catch (e) { /* se deja tal cual */ }

                        localStorage.setItem("clave_escaner", tokenUrl);

                        // Se guarda el token ANTES de borrar el hash
                        history.replaceState(null, "", location.pathname + location.search);
                    }

                    token = (localStorage.getItem("clave_escaner") || "").trim();

                } catch (error) {
                    console.error("Error al obtener token:", error);
                }

                return token;
            }

            obtenerToken();

            function obtenerCabeceras(json = false) {
                const cabeceras = {};

                if (json) {
                    cabeceras["Content-Type"] = "application/json";
                }

                if (token) {
                    cabeceras["x-escaner-token"] = token;
                }

                return cabeceras;
            }

            function marcarConexion(ok, texto) {
                punto.className = "punto " + (ok ? "ok" : "mal");
                estadoPc.textContent = texto;
            }

            function textoDeFalla(error) {
                if (error.estado === 401) {
                    return token
                        ? "Clave incorrecta. Vuelve a escanear el QR de la PC."
                        : "Falta la clave del escáner. Escanea el QR de la PC con la cámara normal del celular.";
                }

                if (error.estado === 403) {
                    return "No tienes permiso para utilizar el escáner.";
                }

                if (error.estado) {
                    return "La PC respondió con error " + error.estado;
                }

                if (error.name === "AbortError") {
                    return "La PC no respondió.";
                }

                return "No llega a la PC. Revisa la conexión WiFi.";
            }

            // ── Comprobar conexión ─────────────────────────────────

            let revisando = false;

            async function revisarPc() {
                if (revisando) return;

                revisando = true;

                const controlador = new AbortController();
                const corte = setTimeout(() => controlador.abort(), 5000);

                try {
                    const res = await fetch("/escaneos", {
                        method: "GET",
                        cache: "no-store",
                        headers: obtenerCabeceras(),
                        signal: controlador.signal
                    });

                    if (!res.ok) {
                        let motivo = "";
                        try { motivo = (await res.json()).error || ""; } catch (e) { /* sin cuerpo JSON */ }

                        const error = new Error(motivo || "HTTP " + res.status);
                        error.estado = res.status;

                        console.warn("Respuesta del servidor:", res.status, motivo,
                            "| token guardado:", token ? "sí" : "NO");
                        throw error;
                    }

                    marcarConexion(true, "Conectado a la PC");

                } catch (error) {
                    marcarConexion(false, textoDeFalla(error));
                    console.error("Error de conexión:", error);

                } finally {
                    clearTimeout(corte);
                    revisando = false;
                }
            }

            revisarPc();
            setInterval(revisarPc, 8000);

            // ── Mensajes flotantes ─────────────────────────────────

            let temporizadorChip = null;

            function mostrarChip(texto, clase, ms) {
                chip.textContent = texto;
                chip.className = "visible " + (clase || "");

                clearTimeout(temporizadorChip);

                temporizadorChip = setTimeout(() => {
                    chip.className = "";
                }, ms || 2200);
            }

            // ── Historial ──────────────────────────────────────────

            function agregarHistorial(codigo, ok) {
                const li = document.createElement("li");
                const b = document.createElement("b");
                const estado = document.createElement("span");

                b.textContent = codigo;
                estado.className = ok ? "ok" : "mal";
                estado.textContent = ok ? "✔ enviado" : "✖ falló";

                li.append(b, estado);
                historial.prepend(li);

                while (historial.children.length > 8) {
                    historial.lastChild.remove();
                }
            }

            // ── Enviar códigos a StockUPT ──────────────────────────

            const vistos = new Map();

            async function enviar(codigoCrudo, desdeCamara) {
                const codigo = String(codigoCrudo || "").trim();

                if (!codigo) return false;

                if (desdeCamara) {
                    const ahora = Date.now();
                    const antes = vistos.get(codigo) || 0;

                    vistos.set(codigo, ahora);

                    if (ahora - antes < 1800) {
                        return false;
                    }
                }

                if (navigator.vibrate) {
                    navigator.vibrate(60);
                }

                mostrarChip("Enviando " + codigo + "...", "", 4000);

                const controlador = new AbortController();
                const corte = setTimeout(() => controlador.abort(), 7000);

                try {
                    const res = await fetch("/escaneos", {
                        method: "POST",
                        headers: obtenerCabeceras(true),
                        body: JSON.stringify({
                            codigo: codigo,
                            dispositivo: "navegador"
                        }),
                        signal: controlador.signal
                    });

                    const datos = await res.json().catch(() => ({}));

                    if (!res.ok) {
                        const error = new Error(datos.error || "Error " + res.status);
                        error.estado = res.status;
                        throw error;
                    }

                    mostrarChip("✔ Enviado a la PC: " + codigo, "ok");

                    agregarHistorial(codigo, true);
                    marcarConexion(true, "Conectado a la PC");

                    return true;

                } catch (error) {
                    const corto = error.estado
                        ? "Error " + error.estado + ": " + error.message
                        : error.name === "AbortError"
                            ? "La PC no respondió"
                            : "No llegó a la PC";

                    mostrarChip("✖ " + corto, "mal", 4500);

                    agregarHistorial(codigo, false);
                    marcarConexion(false, textoDeFalla(error));

                    console.error("Error al enviar código:", error);

                    return false;

                } finally {
                    clearTimeout(corte);
                }
            }

            // ── Envío manual ───────────────────────────────────────

            $("formManual").addEventListener("submit", async function (ev) {
                ev.preventDefault();

                const campo = $("codigoManual");
                const ok = await enviar(campo.value, false);

                if (ok) {
                    campo.value = "";
                }
            });

            // ── Avisos de cámara ───────────────────────────────────

            function avisoCamara(titulo, texto, accion) {
                $("avisoTitulo").textContent = titulo;
                $("avisoTexto").textContent = texto;

                const zona = $("avisoAccion");
                zona.replaceChildren();

                if (accion) {
                    zona.append(accion);
                }

                $("avisoCamara").classList.add("visible");
            }

            function botonReintentar() {
                const b = document.createElement("button");

                b.type = "button";
                b.textContent = "Reintentar cámara";
                b.addEventListener("click", () => location.reload());

                return b;
            }

            // ── Iniciar cámara ─────────────────────────────────────

            async function iniciarCamara() {
                if (!window.isSecureContext) {
                    const enlace = document.createElement("a");

                    // Se pasa el token en el hash: localStorage no se comparte entre http y https
                    enlace.href =
                        "https://" + location.hostname +
                        ":3443/movil.html" +
                        (token ? "#t=" + encodeURIComponent(token) : "");

                    enlace.textContent = "Abrir versión segura";

                    avisoCamara(
                        "Falta conexión segura",
                        "Abre la versión HTTPS para utilizar la cámara.",
                        enlace
                    );

                    return;
                }

                if (typeof Html5Qrcode === "undefined") {
                    avisoCamara(
                        "No cargó el lector",
                        "No se encontró movil/html5-qrcode.min.js.",
                        botonReintentar()
                    );

                    return;
                }

                const F = Html5QrcodeSupportedFormats;

                const lector = new Html5Qrcode("lector", {
                    formatsToSupport: [
                        F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
                        F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.QR_CODE
                    ],
                    useBarCodeDetectorIfSupported: true,
                    verbose: false
                });

                try {
                    await lector.start(
                        { facingMode: "environment" },
                        {
                            fps: 12,
                            qrbox: (ancho, alto) => ({
                                width: Math.floor(Math.min(ancho * 0.86, 360)),
                                height: Math.floor(Math.min(alto * 0.45, 190))
                            })
                        },
                        texto => { enviar(texto, true); },
                        () => { }
                    );

                    $("avisoCamara").classList.remove("visible");

                } catch (error) {
                    const nombre = (error.name || error.message || String(error)) + "";

                    if (/NotAllowed|Permission/i.test(nombre)) {
                        avisoCamara(
                            "Permite la cámara",
                            "Activa el permiso de cámara desde el navegador.",
                            botonReintentar()
                        );

                    } else if (/NotFound|Requested device/i.test(nombre)) {
                        avisoCamara(
                            "No encuentro la cámara",
                            "Este dispositivo no tiene cámara disponible."
                        );

                    } else {
                        avisoCamara("No se pudo abrir la cámara", nombre, botonReintentar());
                    }

                    return;
                }

                // ── Linterna ──

                try {
                    const linterna = lector.getRunningTrackCameraCapabilities().torchFeature();

                    if (linterna.isSupported()) {
                        btnLinterna.style.display = "inline-block";

                        let encendida = false;

                        btnLinterna.addEventListener("click", async () => {
                            try {
                                encendida = !encendida;
                                await linterna.apply(encendida);
                                btnLinterna.classList.toggle("activo", encendida);
                            } catch (error) {
                                encendida = !encendida;
                                console.error(error);
                            }
                        });
                    }

                } catch (error) {
                    console.log("Linterna no disponible.");
                }
            }

            iniciarCamara();

            // ── Mantener pantalla encendida ────────────────────────

            let bloqueoPantalla = null;

            async function pedirBloqueo() {
                try {
                    if ("wakeLock" in navigator) {
                        bloqueoPantalla = await navigator.wakeLock.request("screen");
                    }
                } catch (error) {
                    console.log("Wake Lock no disponible.");
                }
            }

            pedirBloqueo();

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    pedirBloqueo();
                    revisarPc();
                }
            });

        })();
    </script>

</body>
</html>
