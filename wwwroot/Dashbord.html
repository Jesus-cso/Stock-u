
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | StockUPT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #0F172A;
            --bg-surface: #1E293B;
            --bg-card-hover: #334155;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --text-heading: #FFFFFF;
            --text-body: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --focus-ring: #60A5FA;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-body);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: var(--bg-surface);
            min-height: 100vh;
            padding: 32px 20px;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-logout {
            padding: 0 4px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: var(--text-heading);
            text-decoration: none;
            background: var(--bg-page);
            border: 2px solid var(--border-color);
            transition: all 0.2s ease;
        }

            .btn-back:hover {
                color: #FFFFFF;
                background: var(--primary);
                border-color: var(--primary);
                transform: translateX(-2px);
            }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .sidebar nav a {
                display: flex;
                align-items: center;
                color: var(--text-muted);
                text-decoration: none;
                padding: 14px 16px;
                font-size: 15px;
                font-weight: 600;
                border-radius: 10px;
                border: 1px solid transparent;
                transition: all 0.2s ease;
            }

                .sidebar nav a:hover {
                    background: var(--bg-card-hover);
                    color: var(--text-heading);
                    border-color: var(--border-color);
                }

                .sidebar nav a.active {
                    background: var(--primary);
                    color: #FFFFFF;
                    border-color: var(--primary);
                }

        /* CONTENIDO */

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
        }

        .page-body {
            width: 100%;
            max-width: 1100px;
        }

        .dashboard-header {
            margin-bottom: 32px;
        }

            .dashboard-header h1 {
                font-size: 30px;
                font-weight: 800;
                color: var(--text-heading);
                letter-spacing: -0.02em;
            }

            .dashboard-header p {
                color: var(--text-muted);
                font-size: 16px;
                margin-top: 6px;
                font-weight: 500;
            }

        /* TARJETAS */

        .menu-principal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card-menu {
            background: var(--bg-surface);
            text-decoration: none;
            padding: 32px 24px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .card-icon-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 16px;
            background: var(--primary);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.25s ease;
        }

        .card-menu:hover {
            transform: translateY(-6px);
            border-color: var(--focus-ring);
            background: var(--bg-card-hover);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.5);
        }

            .card-menu:hover .card-icon-wrapper {
                transform: scale(1.1);
                background: #FFFFFF;
                color: var(--primary);
                box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
            }

        .card-menu span {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-heading);
            text-align: center;
        }

        /* RESPONSIVE */

        @media(max-width: 850px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 2px solid var(--border-color);
                padding: 16px;
            }

                .sidebar nav {
                    flex-direction: row;
                    overflow-x: auto;
                    padding-bottom: 4px;
                }

                    .sidebar nav a {
                        white-space: nowrap;
                    }

            .main-content {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

    <script src="sesion.js"></script>

    <aside class="sidebar">

        <div class="sidebar-logout">
            <a href="#" id="cerrarSesion" class="btn-back" title="Cerrar sesión">
                <svg width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
        </div>

        <nav>
            <a href="alertas.html">Alertas</a>
            <a href="trabajadores.html">Miembros</a>
            <a href="historial.html">Historial</a>
            <a href="ver_reprtes.html">Ver Reportes</a>
            <a href="control_productos.html">Control de productos</a>
        </nav>

    </aside>

    <main class="main-content">

        <div class="page-body">

            <div class="dashboard-header">
                <h1>Módulos de Inventario</h1>
                <p>Selecciona una opción para gestionar tu sistema</p>
            </div>

            <div class="menu-principal">

                <!-- MATERIALES -->

                <a class="card-menu" href="control_productos.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                    </div>
                    <span>Materiales y<br>mobiliario</span>
                </a>

                <!-- NOTAS DE ENTRADA Y SALIDA -->

                <a class="card-menu" href="ver_reprtes.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </div>
                    <span>Nota de entrada<br>y salida</span>
                </a>

                <!-- CAJA Y ESCANER -->

                <a class="card-menu" href="caja.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 5v14"></path>
                            <path d="M7 5v14"></path>
                            <path d="M11 5v14"></path>
                            <path d="M15 5v14"></path>
                            <path d="M19 5v14"></path>
                            <path d="M21 5v14"></path>
                        </svg>
                    </div>
                    <span>Caja<br>(escáner)</span>
                </a>

                <!-- AREAS Y ANAQUELES -->

                <a class="card-menu" href="anaqueles.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="3" y1="15" x2="21" y2="15"></line>
                            <line x1="12" y1="9" x2="12" y2="21"></line>
                        </svg>
                    </div>
                    <span>Áreas o<br>Anaqueles</span>
                </a>

                <!-- PROVEEDORES -->

                <a class="card-menu" href="provedores.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 3h15v13H1z"></path>
                            <path d="M16 8h4l3 3v5h-7V8z"></path>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                        </svg>
                    </div>
                    <span>Proveedores</span>
                </a>

                <!-- MIEMBROS -->

                <a class="card-menu" href="trabajadores.html">
                    <div class="card-icon-wrapper">
                        <svg width="32" height="32" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <span>Miembros /<br>Empleados</span>
                </a>

            </div>
        </div>

    </main>

    <script>document.getElementById("cerrarSesion").addEventListener("click", function (e) {
            e.preventDefault();

            if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
                window.Sesion.logout();
            }
        });</script>

</body>
</html>
