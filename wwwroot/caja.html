<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caja | StockUPT</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #fff;
            --tx: #1d2330;
            --mut: #667085;
            --bd: #e0e3e8;
            --ent: #14804a;
            --sal: #c2410c;
            --bad: #b42318;
            --acc: var(--sal)
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #14171d;
                --card: #1d222b;
                --tx: #e8ebf0;
                --mut: #9aa4b2;
                --bd: #2c3340;
                --ent: #4ade80;
                --sal: #fb923c;
                --bad: #f87171
            }
        }

        body.entrada {
            --acc: var(--ent)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 15px system-ui,Segoe UI,sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        header {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 3px solid var(--acc);
            flex-wrap: wrap
        }

        h1 {
            font-size: 18px;
            margin: 0
        }

        .modos {
            display: flex;
            gap: 8px
        }

            .modos button {
                padding: 10px 22px;
                border: 2px solid var(--bd);
                background: var(--card);
                color: var(--tx);
                border-radius: 10px;
                font-weight: 700;
                cursor: pointer
            }

                .modos button.on {
                    border-color: var(--acc);
                    background: var(--acc);
                    color: #fff
                }

        main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            padding: 16px 20px;
            max-width: 1200px;
            margin: auto
        }

        @media(max-width:850px) {
            main {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px
        }

        #scan {
            width: 100%;
            font-size: 20px;
            padding: 14px;
            border: 2px solid var(--acc);
            border-radius: 10px;
            background: var(--bg);
            color: var(--tx)
        }

        #msg {
            min-height: 22px;
            margin: 8px 2px;
            font-weight: 600
        }

        .ok {
            color: var(--ent)
        }

        .err {
            color: var(--bad)
        }

        .tabla {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--bd);
            text-align: left
        }

        th {
            font-size: 12px;
            color: var(--mut);
            text-transform: uppercase
        }

            td.num, th.num {
                text-align: right
            }

        tr.falta td {
            background: color-mix(in srgb,var(--bad) 14%,transparent)
        }

        .cant {
            display: flex;
            align-items: center;
            gap: 4px
        }

            .cant button, .x {
                width: 28px;
                height: 28px;
                border: 1px solid var(--bd);
                background: var(--card);
                color: var(--tx);
                border-radius: 6px;
                cursor: pointer
            }

            .cant input, .uni {
                width: 64px;
                padding: 5px;
                border: 1px solid var(--bd);
                border-radius: 6px;
                background: var(--bg);
                color: var(--tx);
                text-align: center
            }

        .uni {
            width: 84px
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mut);
            margin: 10px 0 3px
        }

        .f {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx)
        }

            .f[readonly] {
                opacity: .75
            }

        .tot {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin-top: 14px
        }

        #ok {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: var(--acc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer
        }

            #ok:disabled {
                opacity: .5;
                cursor: not-allowed
            }

        .sec {
            background: none;
            border: 0;
            color: var(--mut);
            cursor: pointer;
            margin-top: 8px;
            width: 100%
        }

        #pdf, #imp {
            display: none;
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 2px solid var(--acc);
            background: none;
            color: var(--acc);
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer
        }

        .vacio {
            text-align: center;
            color: var(--mut);
            padding: 28px
        }

        .solo-ent, .solo-sal {
            display: none
        }

        body.entrada div.solo-ent {
            display: block
        }

        body.salida div.solo-sal {
            display: block
        }
    </style>
</head>
<body class="salida">
    <script src="sesion.js"></script>
    <header>
        <h1>Caja StockUPT <small id="quien" style="color:var(--mut);font-weight:400"></small></h1>
        <div class="modos">
            <button id="bSal" class="on">Nota de salida</button>
            <button id="bEnt">Nota de entrada</button>
        </div>
        <a href="Dashbord.html" style="color:var(--mut)">Volver</a>
    </header>

    <main>
        <section class="card">
            <input id="scan" placeholder="Escanea o escribe el codigo de barras y presiona Enter" autocomplete="off" autofocus>
            <div id="msg" role="status" aria-live="polite"></div>
            <div class="tabla">
                <table>
                    <thead><tr><th>Producto</th><th>Codigo</th><th class="num">Stock</th><th>Unidad</th><th>Cantidad</th><th></th></tr></thead>
                    <tbody id="filas"></tbody>
                </table>
                <div id="vacio" class="vacio">Aun no hay productos. Escanea el primero.</div>
            </div>
            <datalist id="listaUnidades">
                <option value="Pieza"></option>
                <option value="Caja"></option>
                <option value="Paquete"></option>
                <option value="Litro"></option>
                <option value="Kilo"></option>
                <option value="Metro"></option>
                <option value="Juego"></option>
                <option value="Rollo"></option>
            </datalist>
        </section>

        <aside class="card">
            <div class="solo-sal">
                <label>Matricula * <span id="matEstado" style="font-weight:400"></span></label>
                <input id="mat" class="f" autocomplete="off" placeholder="Enter para buscar">
                <label>Nombre *</label><input id="nom" class="f">
                <label>Area</label><input id="area" class="f">
                <label>No. de proyecto (opcional)</label><input id="proy" class="f">
            </div>
            <div class="solo-ent">
                <label>Proveedor *</label><select id="prov" class="f"></select>
                <label>Factura</label><input id="fact" class="f" maxlength="50">
                <label>Observaciones</label><input id="obs" class="f" maxlength="300">
            </div>
            <div class="tot"><span>Articulos</span><span id="nArt">0</span></div>
            <button id="ok" disabled>Registrar</button>
            <button id="pdf" type="button">Ver PDF de la nota</button>
            <button id="imp" type="button">Imprimir nota</button>
            <button class="sec" id="limpiar">Vaciar tabla</button>
        </aside>
    </main>

    <script>
        // sesion.js ya definio window.STOCK_API y agrega el token a cada fetch.
        const API = window.STOCK_API || "http://localhost:3000";
        const RECIBE_ALMACEN = "Julio César Monrroy Guzmán";
        const FUENTE_FIN = "PUA";
        let modo = "salida";
        let items = [];          // {id, nombre, codigo, stock, precio (interno), unidad, cant}
        let guardando = false;
        let ultimaNota = null;      // id_nota de la ultima salida, para el PDF del servidor
        let ultimaImpresion = null; // datos de la ultima nota registrada, para imprimir

        const $ = id => document.getElementById(id);

        function aviso(t, tipo, mudo) { const m = $("msg"); m.textContent = t; m.className = tipo || ""; if (tipo === "err" && !mudo) pitido(); }
        function enfocar() { $("scan").focus(); }

        /* Pitido corto para errores: en caja se mira al lector, no a la pantalla. */
        let audio;
        function pitido() {
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                const o = audio.createOscillator(), g = audio.createGain();
                o.frequency.value = 220; g.gain.value = 0.08;
                o.connect(g); g.connect(audio.destination);
                o.start(); o.stop(audio.currentTime + 0.18);
            } catch (e) { }
        }

        try {
            const u = window.Sesion && window.Sesion.usuario();
            if (u && u.nombre) $("quien").textContent = "| " + u.nombre;
        } catch (e) { }

        async function leer(r) { try { return await r.json(); } catch (e) { return {}; } }

        /* ---------- modo ---------- */
        function cambiarModo(m) {
            modo = m;
            document.body.className = m;
            $("bSal").classList.toggle("on", m === "salida");
            $("bEnt").classList.toggle("on", m === "entrada");
            if (m === "entrada" && $("prov").options.length <= 1) cargarProveedores();
            if (m === "salida") refrescarStock();
            pintar(); enfocar();
        }
        $("bSal").onclick = () => cambiarModo("salida");
        $("bEnt").onclick = () => cambiarModo("entrada");

        async function cargarProveedores() {
            try {
                const r = await fetch(API + "/proveedores");
                const lista = await leer(r);
                if (!r.ok) { aviso(lista.error || "No se pudieron cargar los proveedores.", "err"); return; }
                const actual = $("prov").value;
                $("prov").innerHTML = "<option value=''>Selecciona...</option>";
                lista.forEach(p => {
                    const o = document.createElement("option");
                    o.value = p.id_proveedor; o.textContent = p.nombre;
                    $("prov").appendChild(o);
                });
                $("prov").value = actual;
            } catch (e) { aviso("No se pudieron cargar los proveedores.", "err"); }
        }

        /* ---------- matricula -> nombre y area ---------- */
        async function buscarMiembro() {
            const mat = $("mat").value.trim();
            const est = $("matEstado");
            est.textContent = ""; est.className = "";
            $("nom").readOnly = false; $("area").readOnly = false;
            if (!mat) return;
            try {
                const r = await fetch(API + "/miembros/matricula/" + encodeURIComponent(mat));
                if (r.status === 404) { est.textContent = "(no registrada, captura los datos)"; est.className = "err"; return; }
                if (!r.ok) return;
                const m = await leer(r);
                $("nom").value = m.nombre || "";
                $("area").value = m.area || "";
                $("nom").readOnly = true; $("area").readOnly = true;
                est.textContent = "(encontrada)"; est.className = "ok";
            } catch (e) { }
        }
        $("mat").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); buscarMiembro().then(() => $("nom").readOnly ? enfocar() : $("nom").focus()); } });
        $("mat").addEventListener("change", buscarMiembro);

        /* ---------- escaneo ---------- */
        let cola = Promise.resolve();

        $("scan").addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            const codigo = $("scan").value.trim();
            $("scan").value = "";
            if (!codigo) return;
            cola = cola.then(() => procesarCodigo(codigo));
        });

        async function procesarCodigo(codigo) {
            try {
                const r = await fetch(API + "/productos/codigo/" + encodeURIComponent(codigo));
                if (r.status === 404) { aviso("No existe un producto con el codigo " + codigo, "err"); return; }
                if (r.status === 403) { aviso("No tienes permiso para esta accion.", "err"); return; }
                if (!r.ok) { aviso("Error del servidor (" + r.status + ").", "err"); return; }
                const p = (await r.json()).producto;
                const ya = items.find(i => i.id === p.id_producto);
                if (ya) { ya.cant++; ya.stock = p.stock; }
                else items.push({ id: p.id_producto, nombre: p.nombre, codigo: p.codigo_barras, stock: p.stock, precio: Number(p.precio || 0), unidad: p.unidad || "Pieza", cant: 1 });
                aviso("Agregado: " + p.nombre, "ok");
                pintar();
            } catch (err) { aviso("No se pudo consultar el producto.", "err"); }
        }

        async function refrescarStock() {
            await Promise.all(items.map(async it => {
                try {
                    const r = await fetch(API + "/productos/codigo/" + encodeURIComponent(it.codigo));
                    if (r.ok) it.stock = (await r.json()).producto.stock;
                } catch (e) { }
            }));
            pintar();
        }

        /* ---------- tabla ---------- */
        function celda(tr, txt, cls) { const td = tr.insertCell(); td.textContent = txt; if (cls) td.className = cls; return td; }

        function pintar() {
            const tb = $("filas"); tb.innerHTML = "";
            let arts = 0, falta = false;
            items.forEach((it, idx) => {
                const sinStock = modo === "salida" && it.cant > it.stock;
                if (sinStock) falta = true;
                arts += it.cant;
                const tr = tb.insertRow(); if (sinStock) tr.className = "falta";
                celda(tr, it.nombre);
                celda(tr, it.codigo);
                celda(tr, it.stock, "num");
                const tdu = tr.insertCell();
                const un = document.createElement("input"); un.className = "uni"; un.setAttribute("list", "listaUnidades"); un.maxLength = 20; un.value = it.unidad;
                un.onchange = () => { it.unidad = un.value.trim() || "Pieza"; };
                tdu.appendChild(un);
                const tdc = tr.insertCell(); const c = document.createElement("div"); c.className = "cant";
                const mn = document.createElement("button"); mn.textContent = "-"; mn.type = "button";
                const inp = document.createElement("input"); inp.type = "number"; inp.min = 1; inp.value = it.cant;
                const mas = document.createElement("button"); mas.textContent = "+"; mas.type = "button";
                mn.onclick = () => { it.cant = Math.max(1, it.cant - 1); pintar(); };
                mas.onclick = () => { it.cant++; pintar(); };
                inp.onchange = () => { it.cant = Math.max(1, parseInt(inp.value) || 1); pintar(); };
                c.append(mn, inp, mas); tdc.appendChild(c);
                const tdx = tr.insertCell(); const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "x";
                x.onclick = () => { items.splice(idx, 1); pintar(); enfocar(); }; tdx.appendChild(x);
            });
            $("vacio").style.display = items.length ? "none" : "block";
            $("nArt").textContent = arts;
            $("ok").disabled = guardando || !items.length || falta;
            $("ok").textContent = modo === "salida" ? "Registrar salida" : "Registrar entrada";
            if (falta) aviso("Hay productos con mas cantidad que el stock disponible.", "err", true);
        }

        $("limpiar").onclick = () => {
            if (items.length && !confirm("Se vaciara la tabla. Continuar?")) return;
            items = []; pintar(); enfocar();
        };

        /* ---------- PDF de la nota de salida (servidor) ---------- */
        $("pdf").onclick = async () => {
            if (!ultimaNota) return;
            try {
                const r = await fetch(API + "/Notas/" + ultimaNota + "/pdf");
                if (!r.ok) { aviso("No se pudo generar el PDF (" + r.status + ").", "err"); return; }
                const url = URL.createObjectURL(await r.blob());
                window.open(url, "_blank");
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (e) { aviso("No se pudo generar el PDF.", "err"); }
        };

        /* =====================================================
           IMPRIMIR: abre el formato oficial segun el modo
           (sin precios en ninguno de los dos)
           ===================================================== */
        const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        /* Se llama ANTES de vaciar la tabla y los campos. */
        async function armarNota(d) {
            const n = {
                modo,
                folio: d.folio || d.id_nota || "",
                fecha: new Date(),
                filas: items.map(i => ({ nombre: i.nombre, codigo: i.codigo, cant: i.cant, unidad: i.unidad || "" }))
            };
            if (modo === "salida") {
                n.matricula = $("mat").value.trim();
                n.nombre = $("nom").value.trim();
                n.area = $("area").value.trim();
                n.proyecto = $("proy").value.trim();
                n.lider = "";
                if (n.proyecto) {
                    try {
                        const r = await fetch(API + "/proyectos/numero/" + encodeURIComponent(n.proyecto));
                        const p = await leer(r);
                        if (r.ok && p.encontrado && p.proyecto) n.lider = p.proyecto.lider || "";
                    } catch (e) { }
                }
            } else {
                const opt = $("prov").selectedOptions[0];
                n.proveedor = opt ? opt.textContent : "";
                n.factura = $("fact").value.trim();
                n.obs = $("obs").value.trim();
            }
            return n;
        }

        function rutaImg(nombre) { return new URL("img/" + nombre, window.location.href).href; }

        /* ----- Formato: NOTA DE SALIDA ----- */
        function htmlSalida(n) {
            const f = n.fecha;
            const fecha = String(f.getDate()).padStart(2, "0") + "/" + String(f.getMonth() + 1).padStart(2, "0") + "/" + f.getFullYear();
            const total = Math.max(22, n.filas.length);
            let filas = "";
            for (let i = 0; i < total; i++) {
                const it = n.filas[i];
                filas += `<tr>
<td class="col-cant" contenteditable="true">${it ? esc(it.cant) : ""}</td>
<td class="col-unid" contenteditable="true">${it ? esc(it.unidad) : ""}</td>
<td class="col-desc" contenteditable="true">${it ? esc(it.nombre) : ""}</td>
<td class="col-recb" contenteditable="true">${it ? esc(n.nombre) : ""}</td>
</tr>`;
            }
            return `<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Nota de Salida ${esc(n.folio)}</title>
<style>

.hoja-carta { width: 21.6cm; min-height: 27.9cm; padding: 1.5cm; margin: 0 auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,.1); display: flex; flex-direction: column; }
.header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.logo-img { width: 85px; height: 55px; object-fit: contain; display: block; }
.header-text { text-align: center; flex-grow: 1; font-weight: bold; font-size: 13px; line-height: 1.4; text-transform: uppercase; }
.header-text .titulo-salida { font-size: 14px; margin-top: 6px; border-bottom: 2px solid #000; display: inline-block; padding: 0 15px; }
.datos-control { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
.datos-control td { border: 1px solid #000; padding: 7px; font-size: 11px; vertical-align: middle; }
.bg-titulo { font-style: italic; font-weight: bold; font-size: 17px !important; width: 45%; }
.label-sm { font-size: 9px; font-weight: bold; background: #f2f2f2; width: 10%; text-align: center; }
.campo-dinamico { font-weight: bold; color: #000; font-size: 12px; }
.tabla-articulos { width: 100%; border-collapse: collapse; flex-grow: 1; margin-bottom: 20px; }
.tabla-articulos th { border: 1px solid #000; background: #fff; padding: 6px; font-size: 9px; font-weight: bold; text-transform: uppercase; text-align: center; }
.tabla-articulos td { border: 1px solid #ccc; border-left: 1px solid #000; border-right: 1px solid #000; height: 25px; padding: 2px 6px; font-size: 11px; outline: none; }
.tabla-articulos tr:last-child td { border-bottom: 1px solid #000; }
.col-cant { width: 10%; text-align: center; }
.col-unid { width: 10%; text-align: center; }
.col-desc { width: 60%; }
.col-recb { width: 20%; }
.seccion-firmas { display: flex; justify-content: space-between; gap: 20px; margin-top: auto; padding-top: 15px; }
.bloque-firma { flex: 1; border: 1px solid #000; border-radius: 10px; height: 90px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px; background: #fff; }
.firma-top { font-size: 9px; font-weight: bold; text-transform: uppercase; color: #333; }
.firma-linea { width: 85%; border-top: 1px solid #000; margin-bottom: 2px; }
.firma-sub { font-size: 9px; font-weight: bold; text-transform: uppercase; text-align: center; }
@page { size: letter; margin: 1.2cm; }
@media screen { [contenteditable] { background: #fff9c4; cursor: text; } }
@media print {
      body { background: #fff; padding: 0; }
      .barra { display: none !important; }
      [contenteditable] { background: none !important; }
      .hoja-carta { box-shadow: none; padding: 0; width: 100%; min-height: auto; height: 100%; }
      .tabla-articulos td { border-color: #999; }
}
</style></head><body>
<div class="barra"><button onclick="window.print()">🖨️ Imprimir</button><span>Los campos en amarillo se pueden corregir antes de imprimir.</span></div>
<div class="hoja-carta">
      <div class="header-container">
        <img class="logo-img" src="${rutaImg("logoupt.png")}" alt="" onerror="this.style.visibility='hidden'">
        <div class="header-text">
          UNIVERSIDAD POLITÉCNICA DE TULANCINGO<br>
          DIRECCIÓN DE RECURSOS MATERIALES Y SERVICIOS GENERALES<br>
          ALMACÉN<br>
          <div class="titulo-salida">Salida de Materiales e Insumos</div>
        </div>
        <img class="logo-img" src="${rutaImg("logopolitytec.jpg")}" alt="" onerror="this.style.visibility='hidden'">
      </div>
      <table class="datos-control">
        <tr>
          <td class="bg-titulo" rowspan="2">Nota de Salida</td>
          <td class="label-sm">FOLIO:</td><td class="campo-dinamico" style="width:12%">${esc(n.folio) || "---"}</td>
          <td class="label-sm">FECHA:</td><td class="campo-dinamico" style="width:18%">${fecha}</td>
        </tr>
        <tr>
          <td class="label-sm">ÁREA:</td><td colspan="3" class="campo-dinamico">${esc(n.area) || "---"}</td>
        </tr>
      </table>
      <table class="tabla-articulos">
        <thead><tr><th class="col-cant">Cantidad</th><th class="col-unid">Unidad</th><th class="col-desc">Descripción del Artículo</th><th class="col-recb">Recibió</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="seccion-firmas">
        <div class="bloque-firma"><span class="firma-top">Autoriza</span><div class="firma-linea"></div><span class="firma-sub" contenteditable="true">${esc(n.lider) || "Líder de Proyecto"}</span></div>
        <div class="bloque-firma"><span class="firma-top">Entrega</span><div class="firma-linea"></div><span class="firma-sub">${esc(RECIBE_ALMACEN)}</span></div>
        <div class="bloque-firma"><span class="firma-top">Recibe</span><div class="firma-linea"></div><span class="firma-sub">${esc(n.nombre) || "---"}</span></div>
      </div>
</div>
</body></html>`;
        }

        /* ----- Formato: NOTA DE ENTRADA (sin costos) ----- */
        function htmlEntrada(n) {
            const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
            const f = n.fecha;
            const fechaCorta = String(f.getDate()).padStart(2, "0") + "-" + MESES[f.getMonth()] + "-" + String(f.getFullYear()).slice(-2);
            const total = Math.max(30, n.filas.length);
            let filas = "";
            for (let i = 0; i < total; i++) {
                const it = n.filas[i];
                filas += it
                    ? `<tr><td class="c">${i + 1}</td><td class="c">${esc(it.cant)}</td><td class="c">${esc(String(it.unidad).toUpperCase())}</td><td class="desc">${esc(it.nombre)}</td></tr>`
                    : `<tr><td class="c">&nbsp;</td><td></td><td></td><td></td></tr>`;
            }
            return `<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Nota de Entrada ${esc(n.folio)}</title>
<style>

.val { font-size: 9px; font-weight: bold; display: block; min-height: 11px; }
.centro { text-align: center; }
.enc td { border: none; padding: 0; }
.logo-box { width: 17%; }
.logo-box.der { text-align: right; }
.logo-box img { max-height: 48px; max-width: 100%; }
.titulo-inst { text-align: center; font-weight: bold; font-size: 11px; line-height: 1.3; }
.titulo-inst .sub { font-size: 8.5px; }
.fecha-folio { width: 27%; }
.fecha-folio table td { font-size: 9px; }
.datos td { height: 26px; }
.nombre-doc { width: 26%; font-size: 15px; font-style: italic; font-weight: bold; vertical-align: middle; }
.items th { font-size: 6.5px; text-transform: uppercase; text-align: center; font-weight: normal; background: #f2f2f2; padding: 2px; }
.items td { height: 15px; font-size: 9px; padding: 1px 4px; }
.items td.c { text-align: center; }
.items td.desc { text-align: left; }
.items col.c-item { width: 8%; }
.items col.c-cant { width: 12%; }
.items col.c-uni { width: 14%; }
.items col.c-desc { width: 66%; }
.pie { margin-top: 6px; }
.pie td { height: 30px; }
.firma { height: 48px; }
.rev { margin-top: 10px; font-size: 7.5px; color: #333; line-height: 1.5; }
[contenteditable] { outline: none; }
@media screen {
      [contenteditable] { background: #fff8c5; cursor: text; }
      body { background: #e5e7eb; padding: 14px; }
      .hoja { background: #fff; padding: 10mm; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
      .barra { position: sticky; top: 0; z-index: 5; max-width: 195mm; margin: 0 auto 10px; display: flex; gap: 10px; align-items: center; background: #1E3A8A; color: #fff; padding: 8px 12px; font-size: 12px; border-radius: 6px; }
      .barra button { background: #fff; color: #1E3A8A; border: 0; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
}
@media print {
      .barra { display: none !important; }
      [contenteditable] { background: none !important; }
      .hoja { max-width: 100%; padding: 10mm; }
}
</style></head><body>
<div class="barra"><button onclick="window.print()">🖨️ Imprimir</button><span>Los campos en amarillo se pueden corregir o completar antes de imprimir.</span></div>
<div class="hoja">
      <table class="enc"><tr>
        <td class="logo-box"><img src="${rutaImg("logoupt.png")}" alt="" onerror="this.style.display='none'"></td>
        <td class="titulo-inst">UNIVERSIDAD POLITÉCNICA DE TULANCINGO<br>
          <span class="sub">DIRECCIÓN DE RECURSOS MATERIALES Y SERVICIOS GENERALES</span><br>
          <span class="sub">ENTRADA DE MATERIALES, MOBILIARIO Y EQUIPO</span></td>
        <td class="logo-box der"><img src="${rutaImg("logopolitytec.jpg")}" alt="" onerror="this.style.display='none'"></td>
        <td class="fecha-folio"><table><tr>
          <td style="width:38%"><span class="lbl">Fecha:</span><span class="val centro">${fechaCorta}</span></td>

        <tbody>${filas}</tbody>
      </table>

      <table class="pie">
        <tr>
          <td class="firma" style="width:27%"><span class="lbl">Recibido por:</span><span class="val centro">${esc(RECIBE_ALMACEN)}</span></td>
          <td style="width:25%"><span class="lbl">Fuente de financiamiento:</span><span class="val centro" contenteditable="true">${FUENTE_FIN}</span></td>
          <td style="width:22%"><span class="lbl">Tipo de financiamiento:</span><span class="val centro" contenteditable="true">&nbsp;</span></td>
          <td rowspan="2"><span class="lbl">Observaciones:</span><span class="val" style="font-weight:normal;">${esc(n.obs)}</span></td>
        </tr>
        <tr>
          <td><span class="lbl">Núm. de pedido - contrato:</span><span class="val centro" contenteditable="true">&nbsp;</span></td>
          <td colspan="2"><span class="lbl">Núm. orden de compra:</span><span class="val centro" contenteditable="true">&nbsp;</span></td>
        </tr>
      </table>

        }

        function imprimirNota() {
            const n = ultimaImpresion;
            if (!n) return;
            const w = window.open("", "_blank", "width=900,height=1100");
            if (!w) { aviso("El navegador bloqueó la ventana. Permite pop-ups.", "err"); return; }
            w.document.write(n.modo === "salida" ? htmlSalida(n) : htmlEntrada(n));
            w.document.close();
        }
        $("imp").onclick = imprimirNota;

        /* ---------- guardar ---------- */
        $("ok").onclick = async () => {
            if (guardando) return;
            let url, body;
            if (modo === "salida") {
                const mat = $("mat").value.trim(), nom = $("nom").value.trim();
                if (!mat || !nom) { aviso("Matricula y nombre son obligatorios.", "err"); return; }
                url = API + "/Notas/salida";
                body = {
                    matricula: mat, nombre: nom, area: $("area").value.trim(), numero_proyecto: $("proy").value.trim() || undefined,
                    items: items.map(i => ({ id_producto: i.id, cantidad: i.cant }))
                };
            } else {
                if (!$("prov").value) { aviso("Selecciona un proveedor.", "err"); return; }
                url = API + "/notasEntrada";
                body = {
                    id_proveedor: Number($("prov").value), factura: $("fact").value.trim(), observaciones: $("obs").value.trim(),
                    productos: items.map(i => ({ id_producto: i.id, cantidad: i.cant, unidad: i.unidad, precio_unitario: i.precio }))
                };
            }
            guardando = true; pintar();
            try {
                const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                const d = await leer(r);
                if (!r.ok) {
                    aviso(d.error || "No se pudo guardar (" + r.status + ").", "err");
                    refrescarStock();
                    return;
                }
                ultimaImpresion = await armarNota(d); // antes de vaciar tabla y campos
                items = [];
                $("pdf").style.display = "none"; $("imp").style.display = "none"; ultimaNota = null;
                if (modo === "salida") {
                    ["mat", "nom", "area", "proy"].forEach(id => $(id).value = "");
                    $("nom").readOnly = false; $("area").readOnly = false; $("matEstado").textContent = "";
                    if (d.id_nota) { ultimaNota = d.id_nota; $("pdf").style.display = "block"; }
                } else {
                    $("fact").value = ""; $("obs").value = "";
                }
                $("imp").style.display = "block";
                pintar();
                aviso("Nota registrada" + (d.folio ? ": " + d.folio : "") + ".", "ok");
            } catch (e) {
                aviso("No se pudo conectar con el servidor.", "err");
            } finally {
                guardando = false; pintar();
                enfocar();
            }
        };

        pintar();
    </script>
