<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestión de Proveedores - Sistema de Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1E3A8A;
            --primary-light: #EFF6FF;
            --primary-hover: #1D4ED8;
            --secondary: #10B981;
            --secondary-hover: #059669;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
            --warning: #F59E0B;
            --success: #10B981;
            --gray-900: #0F172A;
            --gray-800: #1E293B;
            --gray-700: #334155;
            --gray-600: #475569;
            --gray-500: #64748B;
            --gray-400: #94A3B8;
            --gray-300: #CBD5E1;
            --gray-200: #E2E8F0;
            --gray-100: #F1F5F9;
            --gray-50: #F8FAFC;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --duration: 300ms;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            display: flex;
            min-height: 100vh;
        }

        /* ═══════════════════════════════════════════════════════ */
        /* SIDEBAR */
        /* ═══════════════════════════════════════════════════════ */

        .sidebar {
            width: 280px;
            background: var(--white);
            padding: 32px 20px;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            gap: 40px;
            box-shadow: inset -1px 0 0 0 var(--gray-100);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

            .sidebar-logo i {
                font-size: 24px;
                color: var(--primary);
            }

            .sidebar-logo span {
                font-size: 16px;
                font-weight: 700;
                color: var(--gray-900);
            }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .sidebar-nav a {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 14px;
                color: var(--gray-600);
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                border-radius: 8px;
                transition: all var(--duration);
                border-left: 3px solid transparent;
            }

                .sidebar-nav a:hover {
                    background: var(--primary-light);
                    color: var(--primary);
                    border-left-color: var(--primary);
                }

                .sidebar-nav a.active {
                    background: var(--primary-light);
                    color: var(--primary);
                    border-left-color: var(--primary);
                }

            .sidebar-nav i {
                font-size: 18px;
                width: 20px;
                text-align: center;
            }

        /* ═══════════════════════════════════════════════════════ */
        /* MAIN CONTENT */
        /* ═══════════════════════════════════════════════════════ */

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        .header {
            background: var(--white);
            padding: 24px 40px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ═══════════════════════════════════════════════════════ */
        /* TOOLBAR */
        /* ═══════════════════════════════════════════════════════ */

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 38px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            background: var(--white);
            transition: all var(--duration);
        }

            .search-input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px var(--primary-light);
            }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 16px;
            pointer-events: none;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--secondary);
            color: var(--white);
        }

            .btn-primary:hover {
                background: var(--secondary-hover);
                transform: translateY(-1px);
                box-shadow: var(--shadow);
            }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-600);
            border: 1px solid var(--gray-300);
        }

            .btn-secondary:hover {
                background: var(--gray-50);
                border-color: var(--gray-400);
            }

        .btn-danger {
            background: var(--danger-light);
            color: var(--danger);
        }

            .btn-danger:hover {
                background: #FCBFBF;
            }

        /* ═══════════════════════════════════════════════════════ */
        /* TABLE */
        /* ═══════════════════════════════════════════════════════ */

        .table-container {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: var(--gray-50);
            padding: 16px 20px;
            font-weight: 600;
            color: var(--gray-700);
            border-bottom: 1px solid var(--gray-200);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-600);
        }

        tbody tr {
            transition: all var(--duration);
        }

            tbody tr:hover {
                background: var(--primary-light);
            }

            tbody tr:last-child td {
                border-bottom: none;
            }

        .col-empresa {
            font-weight: 600;
            color: var(--gray-900);
        }

        .col-estado {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit {
            background: var(--primary-light);
            color: var(--primary);
        }

            .btn-edit:hover {
                background: #DBEAFE;
            }

        .btn-delete {
            background: var(--danger-light);
            color: var(--danger);
        }

            .btn-delete:hover {
                background: #FCBFBF;
            }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
        }

            .empty-state i {
                font-size: 48px;
                color: var(--gray-300);
                margin-bottom: 16px;
            }

            .empty-state h3 {
                font-size: 18px;
                font-weight: 600;
                color: var(--gray-700);
                margin-bottom: 8px;
            }

            .empty-state p {
                color: var(--gray-500);
                font-size: 14px;
                margin-bottom: 24px;
            }

        /* ═══════════════════════════════════════════════════════ */
        /* MODAL */
        /* ═══════════════════════════════════════════════════════ */

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            animation: fadeIn var(--duration) ease-out;
        }

            .modal-overlay.active {
                display: flex;
                align-items: center;
                justify-content: center;
            }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp var(--duration) ease-out;
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .modal-header h2 {
                font-size: 20px;
                font-weight: 700;
                color: var(--gray-900);
            }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray-400);
            cursor: pointer;
            transition: all var(--duration);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .modal-close:hover {
                color: var(--gray-600);
            }

        .modal-body {
            padding: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .form-group.full {
                grid-column: 1 / -1;
            }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
        }

        input, textarea {
            padding: 11px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all var(--duration);
        }

            input:focus, textarea:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px var(--primary-light);
            }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            padding: 20px 28px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ═══════════════════════════════════════════════════════ */
        /* TOASTS & ALERTS */
        /* ═══════════════════════════════════════════════════════ */

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
        }

        .toast {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideIn var(--duration) ease-out;
            min-width: 320px;
        }

            .toast.success {
                border-color: var(--success);
                background: rgba(16, 185, 129, 0.05);
            }

            .toast.error {
                border-color: var(--danger);
                background: rgba(239, 68, 68, 0.05);
            }

            .toast.warning {
                border-color: var(--warning);
                background: rgba(245, 158, 11, 0.05);
            }

            .toast i {
                font-size: 20px;
            }

            .toast.success i {
                color: var(--success);
            }

            .toast.error i {
                color: var(--danger);
            }

            .toast.warning i {
                color: var(--warning);
            }

        .toast-message {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-900);
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--gray-400);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .toast-close:hover {
                color: var(--gray-600);
            }

        /* ═══════════════════════════════════════════════════════ */
        /* LOADING */
        /* ═══════════════════════════════════════════════════════ */

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(400px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ═══════════════════════════════════════════════════════ */
        /* RESPONSIVE */
        /* ═══════════════════════════════════════════════════════ */

        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
                padding: 24px 16px;
            }

            .content {
                padding: 32px 24px;
            }

            .header {
                padding: 20px 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid var(--gray-200);
                padding: 16px;
                gap: 20px;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .sidebar-nav {
                flex-direction: row;
                gap: 4px;
                flex: 1;
            }

                .sidebar-nav a {
                    padding: 8px 12px;
                    font-size: 12px;
                }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-wrapper {
                min-width: auto;
            }

            .content {
                padding: 20px 16px;
            }

            .modal-content {
                width: 95%;
            }

            .table-actions {
                flex-direction: column;
            }

            .btn-action {
                width: 100%;
                justify-content: center;
            }

            .toast-container {
                right: 12px;
                left: 12px;
                max-width: none;
            }

            .toast {
                min-width: auto;
            }
        }
    </style>

</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-warehouse"></i>
            <span>Inventario</span>
        </div>
        <a href="Dashbord.html" title="Volver al menú">
            ⬅
        </a>
        <nav class="sidebar-nav">
            <a href="provedores.html" class="active">
                <i class="fas fa-building"></i>
                Proveedores
            </a>
            <a href="historial.html">
                <i class="fas fa-history"></i>
                Historial
            </a>
            <a href="control_productos.html">
                <i class="fas fa-boxes"></i>
                Productos
            </a>
            <a href="#">
                <i class="fas fa-chart-bar"></i>
                Reportes
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="header">
            <h1 class="header-title">Gestión de Proveedores</h1>
            <div class="header-actions">
                <i class="fas fa-bell" style="font-size: 20px; color: var(--gray-400); cursor: pointer;"></i>
                <i class="fas fa-user-circle" style="font-size: 28px; color: var(--gray-400); cursor: pointer;"></i>
            </div>
        </header>

        <section class="content">
            <div class="toolbar">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Buscar por nombre, contacto, teléfono...">
                </div>
                <button class="btn btn-primary" id="btnNuevoProveedor">
                    <i class="fas fa-plus"></i>
                    Nuevo Proveedor
                </button>
            </div>

            <!-- TABLA DE PROVEEDORES -->
            <div class="table-container">
                <div class="table-wrapper">
                    <table id="tablaProveedores">
                        <thead>
                            <tr>
                                <th>Empresa</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Ubicación</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px;">
                                    <div class="loading" style="display: inline-block;"></div>
                                    <p style="margin-top: 12px; color: var(--gray-500);">Cargando proveedores...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL PROVEEDOR -->
    <div class="modal-overlay" id="modalProveedor">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Nuevo Proveedor</h2>
                <button class="modal-close" id="btnCerrarModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="formProveedor">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="nombre">Nombre de la Empresa *</label>
                            <input type="text" id="nombre" placeholder="Ej. Distribuidora Global S.A." required>
                        </div>
                        <div class="form-group">
                            <label for="contacto">Nombre del Contacto</label>
                            <input type="text" id="contacto" placeholder="Nombre de la persona encargada">
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" placeholder="Ej. +52 55 1234 5678">
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo Electrónico</label>
                            <input type="email" id="correo" placeholder="ejemplo@correo.com">
                        </div>
                        <div class="form-group full">
                            <label for="direccion">Dirección Fiscal / Física</label>
                            <input type="text" id="direccion" placeholder="Calle, Número, Colonia, CP">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelarForm">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        <span id="btnTexto">Guardar Proveedor</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="sesion.js"></script>
    <script>
        // ═══════════════════════════════════════════════════════
        // CONFIGURACIÓN
        // ═══════════════════════════════════════════════════════
        const API_BASE = "/proveedores";
        const DOM = {
            modal: document.getElementById("modalProveedor"),
            modalTitulo: document.getElementById("modalTitulo"),
            btnCerrarModal: document.getElementById("btnCerrarModal"),
            btnCancelarForm: document.getElementById("btnCancelarForm"),
            btnNuevoProveedor: document.getElementById("btnNuevoProveedor"),
            formProveedor: document.getElementById("formProveedor"),
            tablaBody: document.getElementById("tablaBody"),
            tablaProveedores: document.getElementById("tablaProveedores"),
            searchInput: document.getElementById("searchInput"),
            toastContainer: document.getElementById("toastContainer"),
            nombre: document.getElementById("nombre"),
            contacto: document.getElementById("contacto"),
            telefono: document.getElementById("telefono"),
            correo: document.getElementById("correo"),
            direccion: document.getElementById("direccion"),
            btnTexto: document.getElementById("btnTexto")
        };

        let proveedorEditando = null;
        let todosProveedores = [];

        // ═══════════════════════════════════════════════════════
        // FUNCIONES AUXILIARES
        // ═══════════════════════════════════════════════════════

        function mostrarToast(mensaje, tipo = "success") {
            const toast = document.createElement("div");
            toast.className = `toast ${tipo}`;

            let icono = "fa-check-circle";
            if (tipo === "error") icono = "fa-exclamation-circle";
            if (tipo === "warning") icono = "fa-info-circle";

            toast.innerHTML = `
                            <i class="fas ${icono}"></i>
                            <span class="toast-message">${mensaje}</span>
                            <button class="toast-close">
                                <i class="fas fa-times"></i>
                            </button>
                        `;

            DOM.toastContainer.appendChild(toast);
            toast.querySelector(".toast-close").addEventListener("click", () => {
                toast.style.animation = "slideIn var(--duration) ease-out reverse";
                setTimeout(() => toast.remove(), 300);
            });

            setTimeout(() => {
                toast.style.animation = "slideIn var(--duration) ease-out reverse";
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function abrirModal(titulo = "Nuevo Proveedor") {
            DOM.modalTitulo.textContent = titulo;
            DOM.modal.classList.add("active");
            DOM.formProveedor.reset();
            proveedorEditando = null;
            DOM.btnTexto.textContent = "Guardar Proveedor";
        }

        function cerrarModal() {
            DOM.modal.classList.remove("active");
            DOM.formProveedor.reset();
            proveedorEditando = null;
        }

        function crearFilaTabla(proveedor) {
            const fila = document.createElement("tr");
            fila.dataset.id = proveedor.id_proveedor;

            fila.innerHTML = `
                            <td class="col-empresa">${proveedor.nombre}</td>
                            <td>${proveedor.contacto || "—"}</td>
                            <td>${proveedor.telefono || "—"}</td>
                            <td>${proveedor.correo || "—"}</td>
                            <td>${proveedor.direccion || "—"}</td>
                            <td>
                                <span class="col-estado">
                                    <span class="badge badge-success">
                                        <i class="fas fa-circle" style="font-size: 6px;"></i>
                                        Activo
                                    </span>
                                </span>
                            </td>
                            <td>
                                <div class="table-actions">
                                    <button class="btn-action btn-edit" title="Editar">
                                        <i class="fas fa-edit"></i>
                                        Editar
                                    </button>
                                    <button class="btn-action btn-delete" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                        Eliminar
                                    </button>
                                </div>
                            </td>
                        `;

            return fila;
        }

        // ═══════════════════════════════════════════════════════
        // API CALLS
        // ═══════════════════════════════════════════════════════

        async function cargarProveedores() {
            try {
                const response = await fetch(API_BASE);
                if (!response.ok) throw new Error("Error al cargar proveedores");

                todosProveedores = await response.json();
                actualizarTabla(todosProveedores);
            } catch (error) {
                console.error("Error:", error);
                mostrarToast("Error al cargar los proveedores", "error");
                DOM.tablaBody.innerHTML = `
                                <tr>
                                    <td colspan="7" class="empty-state">
                                        <i class="fas fa-exclamation-triangle"></i>
                                        <h3>Error al cargar</h3>
                                        <p>No se pudieron cargar los proveedores. Intenta más tarde.</p>
                                    </td>
                                </tr>
                            `;
            }
        }

        async function guardarProveedor() {
            const datos = {
                nombre: DOM.nombre.value.trim(),
                contacto: DOM.contacto.value.trim() || null,
                telefono: DOM.telefono.value.trim() || null,
                correo: DOM.correo.value.trim() || null,
                direccion: DOM.direccion.value.trim() || null
            };

            if (!datos.nombre) {
                mostrarToast("El nombre de la empresa es obligatorio", "warning");
                return;
            }

            try {
                const metodo = proveedorEditando ? "PUT" : "POST";
                const url = proveedorEditando ? `${API_BASE}/${proveedorEditando}` : API_BASE;

                const response = await fetch(url, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || "Error en la operación");
                }

                mostrarToast(
                    proveedorEditando ? "Proveedor actualizado correctamente" : "Proveedor creado correctamente",
                    "success"
                );

                cerrarModal();
                cargarProveedores();
            } catch (error) {
                console.error("Error:", error);
                mostrarToast(error.message, "error");
            }
        }

        async function eliminarProveedor(id, nombre) {
            if (!confirm(`¿Estás seguro de que deseas eliminar "${nombre}"?`)) return;

            try {
                const response = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });

                if (!response.ok) throw new Error("Error al eliminar");

                mostrarToast("Proveedor eliminado correctamente", "success");
                cargarProveedores();
            } catch (error) {
                console.error("Error:", error);
                mostrarToast("No se pudo eliminar el proveedor", "error");
            }
        }

        // ═══════════════════════════════════════════════════════
        // ACTUALIZAR TABLA
        // ═══════════════════════════════════════════════════════

        function actualizarTabla(proveedores) {
            DOM.tablaBody.innerHTML = "";

            if (proveedores.length === 0) {
                DOM.tablaBody.innerHTML = `
                                <tr>
                                    <td colspan="7">
                                        <div class="empty-state">
                                            <i class="fas fa-inbox"></i>
                                            <h3>Sin proveedores</h3>
                                            <p>No hay proveedores registrados aún. ¡Crea el primero!</p>
                                        </div>
                                    </td>
                                </tr>
                            `;
                return;
            }

            proveedores.forEach(proveedor => {
                DOM.tablaBody.appendChild(crearFilaTabla(proveedor));
            });

            // Agregar event listeners a botones
            document.querySelectorAll(".btn-edit").forEach(btn => {
                btn.addEventListener("click", () => {
                    const id = btn.closest("tr").dataset.id;
                    const proveedor = todosProveedores.find(p => p.id_proveedor == id);
                    editarProveedor(proveedor);
                });
            });

            document.querySelectorAll(".btn-delete").forEach(btn => {
                btn.addEventListener("click", () => {
                    const row = btn.closest("tr");
                    const id = row.dataset.id;
                    const nombre = row.querySelector(".col-empresa").textContent;
                    eliminarProveedor(id, nombre);
                });
            });
        }

        function editarProveedor(proveedor) {
            // abrirModal limpia el formulario, por eso se llama primero
            abrirModal("Editar Proveedor");
            proveedorEditando = proveedor.id_proveedor;
            DOM.nombre.value = proveedor.nombre;
            DOM.contacto.value = proveedor.contacto || "";
            DOM.telefono.value = proveedor.telefono || "";
            DOM.correo.value = proveedor.correo || "";
            DOM.direccion.value = proveedor.direccion || "";
            DOM.btnTexto.textContent = "Actualizar Proveedor";
        }

        // ═══════════════════════════════════════════════════════
        // BÚSQUEDA
        // ═══════════════════════════════════════════════════════

        function buscar(termino) {
            const filtrados = todosProveedores.filter(proveedor => {
                const texto = `${proveedor.nombre} ${proveedor.contacto || ""} ${proveedor.telefono || ""} ${proveedor.correo || ""} ${proveedor.direccion || ""}`.toLowerCase();
                return texto.includes(termino.toLowerCase());
            });
            actualizarTabla(filtrados);
        }

        // ═══════════════════════════════════════════════════════
        // EVENT LISTENERS
        // ═══════════════════════════════════════════════════════

        DOM.btnNuevoProveedor.addEventListener("click", () => {
            abrirModal("Nuevo Proveedor");
        });

        DOM.btnCerrarModal.addEventListener("click", cerrarModal);
        DOM.btnCancelarForm.addEventListener("click", cerrarModal);

        DOM.modal.addEventListener("click", (e) => {
            if (e.target === DOM.modal) cerrarModal();
        });

        DOM.formProveedor.addEventListener("submit", (e) => {
            e.preventDefault();
            guardarProveedor();
        });

        DOM.searchInput.addEventListener("input", (e) => {
            buscar(e.target.value);
        });

        // ═══════════════════════════════════════════════════════
        // INICIALIZACIÓN
        // ═══════════════════════════════════════════════════════

        document.addEventListener("DOMContentLoaded", () => {
            cargarProveedores();
        });
    </script>
</body>
</html>
