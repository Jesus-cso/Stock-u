<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - StockUPT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #f4f6f9; --card: #ffffff; --primary: #2c3e50; --accent: #2563eb; --danger: #dc2626; --muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: #0f172a; margin: 0; }
        header { background: var(--primary); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        header h1 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
        .nav-links a { color: #e2e8f0; text-decoration: none; font-size: 0.92rem; padding: 6px 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); }
        .container { width: 92%; max-width: 960px; margin: 24px auto; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06); border: 1px solid var(--border); margin-bottom: 24px; }
        .panel h2 { margin: 0 0 16px 0; font-size: 1.1rem; color: var(--primary); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; font-family: inherit; background: #fff; }
        .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
        button { border: none; border-radius: 8px; padding: 10px 16px; font-size: 0.92rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .buscar-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .buscar-row input { flex: 1; min-width: 200px; }
        .resultado-box { margin-top: 16px; padding: 16px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); display: none; }
        .resultado-box p { margin: 6px 0; color: #334155; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 999; }
        .toast.show { opacity: 1; }
        .toast.error { background: #991b1b; }
    </style>
</head>
<body>
    <script src="sesion.js"></script>
    <header>
        <h1><i class="fa-solid fa-diagram-project"></i> Proyectos</h1>
        <div class="nav-links"><a href="Dashbord.html"><i class="fa-solid fa-arrow-left"></i> Panel</a></div>
    </header>
    <main class="container">
        <section class="panel">
            <h2>Registrar Proyecto</h2>
            <form id="formProyecto">
                <div class="form-grid">
                    <div class="field">
                        <label for="numeroProyecto">Número de proyecto *</label>
                        <input type="text" id="numeroProyecto" required placeholder="Ej. PRY-001">
                    </div>
                    <div class="field">
                        <label for="matriculaLider">Matrícula del líder *</label>
                        <input type="text" id="matriculaLider" required placeholder="Ej. 20231001">
                    </div>
                    <div class="field">
                        <label for="nombreProyecto">Nombre del proyecto</label>
                        <input type="text" id="nombreProyecto" placeholder="Opcional">
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-plus"></i> Registrar Proyecto</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Buscar Proyecto por Número</h2>
            <div class="buscar-row">
                <input type="text" id="buscarNumero" placeholder="Escribe el número de proyecto...">
                <button type="button" class="btn-secondary" id="btnBuscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
            </div>
            <div id="resultadoBusqueda" class="resultado-box"></div>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="proyectos.js"></script>
</body>
</html>
